# ===========================================================================
# CI — the gate in front of `main`. Epic 18.
#
# north-star.md §4.3 named this as the first piece of physical architecture
# that must exist, prior to any deploy target. It runs the FULL existing suite
# on every push and pull request and fails on anything less than fully green.
#
# Two rules, both from an incident this repository already had (§4.3):
#
#   1. No test or lint command is piped. Each writes to a file, its OWN exit
#      status is checked, and only then is the file read. A run piped through
#      `tail` reports the pipe's exit code and reads as green when it is not.
#   2. Counts are asserted, not only exit codes — infra/ci/assert_count.py
#      against infra/ci/floors.json. Without a database 186 API tests ERROR
#      and the passing count silently drops; an exit code cannot tell that
#      from a full run.
#
# Three jobs, one per runtime, so a failure names its half in seconds:
#
#   api       ruff, mypy (ceiling), alembic upgrade head against a real
#             Postgres 17 service, then pytest against it and a real Redis;
#             the OpenAPI export is diffed against the committed contract.
#   workers   pytest, with the same services (it shares the API's models).
#   web       shared-types, design-system and web: tests, typechecks, and the
#             styleguide build; the generated TS contract is diffed too.
#
# SECRETS: none. The services are ephemeral containers on localhost and the
# suite's `AVP_TEST_*` variables are pointed at them by name. No provider key
# is needed — every third-party call in the suite is faked at the boundary.
# ===========================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The test suite's own discovery variables (apps/api/tests/conftest.py).
  # Service containers publish on the runner's localhost.
  AVP_TEST_DATABASE_URL: postgresql+asyncpg://avp:avp@127.0.0.1:5432/avp_test
  AVP_TEST_REDIS_URL: redis://127.0.0.1:6379/15

jobs:
  api:
    name: api — ruff, mypy, migrations, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avp
          POSTGRES_PASSWORD: avp
          POSTGRES_DB: avp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avp -d avp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install (locked)
        run: uv sync --frozen

      - name: ruff (src and tests — scripts/ carries an accepted baseline)
        run: uv run ruff check src tests

      - name: mypy (must not exceed the ceiling in infra/ci/floors.json)
        run: |
          set +e
          uv run mypy src > "$RUNNER_TEMP/mypy.log" 2>&1
          echo "mypy exit: $?"
          set -e
          tail -1 "$RUNNER_TEMP/mypy.log"
          python3 ../../infra/ci/assert_count.py api-mypy-errors "$RUNNER_TEMP/mypy.log"

      - name: alembic upgrade head (real Postgres, before any test)
        working-directory: infra/db
        env:
          DATABASE_URL: ${{ env.AVP_TEST_DATABASE_URL }}
        run: |
          ../../apps/api/.venv/bin/alembic upgrade head
          ../../apps/api/.venv/bin/alembic check

      - name: pytest
        run: |
          rc=0; uv run pytest -q -p no:cacheprovider > "$RUNNER_TEMP/pytest.log" 2>&1 || rc=$?
          tail -3 "$RUNNER_TEMP/pytest.log"
          if [ "$rc" != 0 ]; then
            grep -E "^(FAILED|ERROR)" "$RUNNER_TEMP/pytest.log" | head -40
            exit "$rc"
          fi
          python3 ../../infra/ci/assert_count.py api-pytest "$RUNNER_TEMP/pytest.log"

      - name: OpenAPI contract is committed and current
        run: |
          uv run python scripts/export_openapi.py "$RUNNER_TEMP/openapi.json" > /dev/null
          diff -u ../../packages/shared-types/openapi.json "$RUNNER_TEMP/openapi.json" \
            || { echo "::error::packages/shared-types/openapi.json is stale — run scripts/export_openapi.py and commit"; exit 1; }

  workers:
    name: workers — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/workers
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avp
          POSTGRES_PASSWORD: avp
          POSTGRES_DB: avp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avp -d avp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/workers/uv.lock

      - name: Install (locked)
        run: uv sync --frozen

      - name: pytest
        run: |
          rc=0; uv run pytest -q -p no:cacheprovider > "$RUNNER_TEMP/pytest.log" 2>&1 || rc=$?
          tail -3 "$RUNNER_TEMP/pytest.log"
          if [ "$rc" != 0 ]; then
            grep -E "^(FAILED|ERROR)" "$RUNNER_TEMP/pytest.log" | head -40
            exit "$rc"
          fi
          python3 ../../infra/ci/assert_count.py workers-pytest "$RUNNER_TEMP/pytest.log"

  web:
    name: web — shared-types, design-system, web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads `packageManager` from package.json (pnpm 9.12.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: the repo's engines floor is 20.11, and Node 24 breaks
          # esbuild's service process in this workspace.
          node-version: "22"
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: shared-types — tests
        working-directory: packages/shared-types
        run: |
          rc=0; pnpm test > "$RUNNER_TEMP/st.log" 2>&1 || rc=$?
          grep -E "^# (pass|fail)" "$RUNNER_TEMP/st.log"
          [ "$rc" = 0 ] || { tail -60 "$RUNNER_TEMP/st.log"; exit "$rc"; }
          python3 ../../infra/ci/assert_count.py shared-types-node-test "$RUNNER_TEMP/st.log"

      - name: shared-types — typecheck
        working-directory: packages/shared-types
        run: pnpm typecheck

      - name: shared-types — generated contract is committed and current
        working-directory: packages/shared-types
        run: |
          pnpm generate > /dev/null
          git diff --exit-code -- src/api.gen.ts \
            || { echo "::error::packages/shared-types/src/api.gen.ts is stale — run pnpm generate and commit"; exit 1; }

      - name: design-system — tests
        working-directory: packages/design-system
        run: |
          rc=0; pnpm test > "$RUNNER_TEMP/ds.log" 2>&1 || rc=$?
          grep -E "Tests |Test Files" "$RUNNER_TEMP/ds.log"
          [ "$rc" = 0 ] || { grep -E "FAIL|AssertionError|Error:" "$RUNNER_TEMP/ds.log" | head -40; exit "$rc"; }
          python3 ../../infra/ci/assert_count.py design-system-vitest "$RUNNER_TEMP/ds.log"

      - name: design-system — typecheck
        working-directory: packages/design-system
        run: pnpm typecheck

      - name: design-system — styleguide builds
        working-directory: packages/design-system
        run: pnpm build

      - name: web — tests
        working-directory: apps/web
        run: |
          rc=0; pnpm test > "$RUNNER_TEMP/web.log" 2>&1 || rc=$?
          grep -E "Tests |Test Files" "$RUNNER_TEMP/web.log"
          [ "$rc" = 0 ] || { grep -E "FAIL|AssertionError|Error:" "$RUNNER_TEMP/web.log" | head -40; exit "$rc"; }
          python3 ../../infra/ci/assert_count.py web-vitest "$RUNNER_TEMP/web.log"

      - name: web — typecheck
        working-directory: apps/web
        run: pnpm typecheck
