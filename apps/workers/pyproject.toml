[project]
name = "avp-workers"
version = "0.1.0"
description = "AI Visibility Platform — background scan workers (Celery)"
requires-python = ">=3.12,<3.14"
license = { text = "UNLICENSED" }

# Licences verified per ip-safety.md #6 — see apps/api/scripts/license_audit.py.
dependencies = [
    "celery[redis]>=5.4,<6",  # BSD-3-Clause
    "redis>=5.2,<7",          # MIT
    "structlog>=24.4,<26",    # MIT OR Apache-2.0
    "avp-api",                # path dependency — shares the SQLAlchemy models
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",          # MIT
    "pytest-asyncio>=0.24,<2", # Apache-2.0
    "ruff>=0.8,<0.15",         # MIT
    "mypy>=1.13,<2",           # MIT
]

# The workers reuse the API's models rather than redefining them. Two
# declarations of the same schema in one repo is how they drift.
[tool.uv.sources]
avp-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avp_workers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
