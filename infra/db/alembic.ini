# Alembic configuration.
#
# Migrations live in /infra/db per product-spec.md §5.2 ("/infra/db -> migrations,
# schema"), while the SQLAlchemy models they reflect live in apps/api. env.py
# bridges the two by putting apps/api/src on sys.path.
#
# The database URL is NOT stored here. It is read from DATABASE_URL at runtime
# by env.py, so a connection string never lands in version control.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped, descriptive revision filenames beat opaque hashes when reading
# `git log` on the migrations directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No post_write_hooks. A formatter hook resolved from Alembic's own entrypoints
# fails when the tool lives in the API venv, and a hook that errors on every
# `alembic revision` is worse than unformatted output. Run `ruff format` from
# apps/api if a generated migration needs tidying.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
